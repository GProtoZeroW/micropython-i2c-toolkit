[project]
name = "micropython-i2c-toolkit"
version = "0.0.0"
description = "Host-side tooling for developing and driving the MicroPython I2C harness"
requires-python = ">=3.11"
dependencies = [
    "mpremote>=1.28",
    "jupyterlab>=4.6",
    "jupyter_micropython_kernel>=0.1.3",
    "jupytext>=1.19",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.uv]
package = false
